name: Build Canopy Lighting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Prepare minimal Stardew references
        run: |
          mkdir -p /tmp/stardew-stub
          touch /tmp/stardew-stub/Stardew Valley.dll

      - name: Build mod
        run: dotnet build CanopyLighting.csproj --configuration Release -p:GamePath=/tmp/stardew-stub -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package mod
        shell: bash
        run: |
          mkdir -p artifact/CanopyLighting
          cp manifest.json artifact/CanopyLighting/
          find bin/Release -type f -name 'CanopyLighting.dll' -exec cp {} artifact/CanopyLighting/ \;
          cd artifact
          zip -r ../CanopyLighting.zip CanopyLighting

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanopyLighting
          path: CanopyLighting.zip
          if-no-files-found: error
