name: Build Double Tap HUD

on:
  push:
    branches: [ doubletap-build-artifact ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Build compile-only SMAPI API shim
        run: dotnet build ci/SmapiStub/SmapiStub.csproj --configuration Release
      - name: Build mod
        run: dotnet build DoubleTapHUD.csproj --configuration Release
      - name: Package installable mod
        run: |
          mkdir -p artifact/DoubleTapHUD
          cp bin/Release/net6.0/DoubleTapHUD.dll manifest.json config.json README.md artifact/DoubleTapHUD/
          cd artifact
          zip -qr DoubleTapHUD-0.2.2-installable.zip DoubleTapHUD
          mkdir -p ../export
          cp DoubleTapHUD-0.2.2-installable.zip ../export/DoubleTapHUD-0.2.2-installable.zip
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export/DoubleTapHUD-0.2.2-installable.zip
          git commit -m "Publish Double Tap HUD 0.2.2 installable ZIP" || echo "ZIP unchanged"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: DoubleTapHUD-0.2.2-installable
          path: artifact/DoubleTapHUD-0.2.2-installable.zip
          if-no-files-found: error