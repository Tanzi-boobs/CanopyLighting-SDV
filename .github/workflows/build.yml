name: Build Canopy Lighting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Configure CI references
        run: |
          dotnet add CanopyLighting.csproj package StardewModdingAPI.Framework --version 4.1.10 || true
          dotnet add CanopyLighting.csproj package Pathoschild.Stardew.ModBuildConfig --version 4.4.0 || true

      - name: Build mod
        run: dotnet build CanopyLighting.csproj --configuration Release -p:EnableModDeploy=false -p:EnableModZip=false -p:GamePath=/tmp/stardew-stub

      - name: Package mod
        shell: bash
        run: |
          mkdir -p artifact/CanopyLighting
          cp manifest.json artifact/CanopyLighting/
          find bin/Release -type f -name 'CanopyLighting.dll' -exec cp {} artifact/CanopyLighting/ \;
          cd artifact
          zip -r ../CanopyLighting.zip CanopyLighting

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanopyLighting
          path: CanopyLighting.zip
          if-no-files-found: error