name: Build Canopy Lighting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Build compile-only SMAPI API shim
        run: dotnet build ci/SmapiStub/SmapiStub.csproj --configuration Release

      - name: Build mod
        run: dotnet build CanopyLighting.csproj --configuration Release

      - name: Package
        shell: bash
        run: |
          mkdir -p artifact/CanopyLighting
          cp manifest.json artifact/CanopyLighting/
          cp bin/Release/net6.0/CanopyLighting.dll artifact/CanopyLighting/
          cp config.json artifact/CanopyLighting/ 2>/dev/null || true
          cd artifact
          zip -r ../CanopyLighting.zip CanopyLighting

      - uses: actions/upload-artifact@v4
        with:
          name: CanopyLighting
          path: CanopyLighting.zip
          if-no-files-found: error