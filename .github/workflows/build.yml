name: Build Canopy Lighting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Build compile-only SMAPI API shim
        run: dotnet build ci/SmapiStub/SmapiStub.csproj --configuration Release

      - name: Build mod
        run: dotnet build CanopyLighting.csproj --configuration Release

      # The compiled shader stays out of this public repository.
      # CI therefore publishes only the DLL for validation; this is not an installable mod ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: CanopyLighting-DLL-validation-only
          path: bin/Release/net6.0/CanopyLighting.dll
          if-no-files-found: error
