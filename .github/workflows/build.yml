name: Build Canopy Lighting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Download SMAPI release
        shell: bash
        run: |
          curl -fL https://github.com/Pathoschild/SMAPI/releases/download/4.5.2/SMAPI-4.5.2-installer.zip -o /tmp/smapi.zip
          unzip -q /tmp/smapi.zip -d /tmp/smapi-release
          find /tmp/smapi-release -type f -name 'StardewModdingAPI.dll' -print
          find /tmp/smapi-release -type f -name 'StardewModdingAPI.dll' -exec cp {} refs/ \;
          test -f refs/StardewModdingAPI.dll

      - name: Build
        run: dotnet build CanopyLighting.csproj --configuration Release

      - name: Package
        shell: bash
        run: |
          mkdir -p artifact/CanopyLighting
          cp manifest.json artifact/CanopyLighting/
          cp bin/Release/net6.0/CanopyLighting.dll artifact/CanopyLighting/
          cd artifact
          zip -r ../CanopyLighting.zip CanopyLighting

      - uses: actions/upload-artifact@v4
        with:
          name: CanopyLighting
          path: CanopyLighting.zip
          if-no-files-found: error
