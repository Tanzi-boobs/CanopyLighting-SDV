name: Build Canopy Lighting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Download SMAPI source and build its API assembly
        shell: bash
        run: |
          git clone --depth 1 --branch develop https://github.com/Pathoschild/SMAPI.git /tmp/smapi
          mkdir -p /tmp/game refs
          touch "/tmp/game/Stardew Valley.dll" "/tmp/game/StardewValley.GameData.dll" "/tmp/game/BmFont.dll" "/tmp/game/GalaxyCSharp.dll" "/tmp/game/Lidgren.Network.dll" "/tmp/game/MonoGame.Framework.dll" "/tmp/game/SkiaSharp.dll" "/tmp/game/xTile.dll"
          echo '<Project><PropertyGroup><GamePath>/tmp/game</GamePath></PropertyGroup></Project>' > "$HOME/stardewvalley.targets"
          dotnet build /tmp/smapi/src/SMAPI/SMAPI.csproj -p:GamePath=/tmp/game -p:EnableModDeploy=false -p:EnableModZip=false
          find /tmp/smapi/src/SMAPI/bin -type f -name 'StardewModdingAPI.dll' -exec cp {} refs/ \;
          test -f refs/StardewModdingAPI.dll

      - name: Build mod
        run: dotnet build CanopyLighting.csproj --configuration Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package
        shell: bash
        run: |
          mkdir -p artifact/CanopyLighting
          cp manifest.json artifact/CanopyLighting/
          cp bin/Release/net6.0/CanopyLighting.dll artifact/CanopyLighting/
          cd artifact
          zip -r ../CanopyLighting.zip CanopyLighting

      - uses: actions/upload-artifact@v4
        with:
          name: CanopyLighting
          path: CanopyLighting.zip
          if-no-files-found: error
