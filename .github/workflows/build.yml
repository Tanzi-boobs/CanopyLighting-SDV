name: Build Canopy Lighting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Use SMAPI and game assemblies
        run: |
          dotnet add CanopyLighting.csproj package Pathoschild.Stardew.ModBuildConfig --version 4.4.0

      - name: Build
        run: dotnet build CanopyLighting.csproj --configuration Release -p:GamePath=/tmp/game -p:EnableModDeploy=false
